<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E4372E"/>
    </marker>
    <style>
      .title { font: 800 30px 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill:#161616; }
      .band-title { font: 800 19px 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill:#161616; }
      .label { font: 600 14px 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill:#161616; }
      .caption { font: 400 12px 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill:#5E5E5E; }
      .rail { font: 700 13px 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill:#161616; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#FAF9F5"/>
  <text x="36" y="38" class="title">房修小匠｜从平台机器人到企业维修系统</text>
  <text x="36" y="62" class="caption">把维修经验、规范和企业文档，组织成可检索、可判断、可追溯的交付系统</text>

  <g id="users">
    <rect x="36" y="84" width="1006" height="66" rx="10" fill="#FFF7F2" stroke="#E4372E" stroke-width="1.5"/>
    <text x="539" y="110" text-anchor="middle" class="band-title" fill="#E4372E">使用角色 / 业务入口</text>
    <rect x="170" y="120" width="180" height="22" rx="6" fill="#FFFFFF" stroke="#E8D5CC"/>
    <text x="260" y="136" text-anchor="middle" class="label">工程师｜现场判断</text>
    <rect x="452" y="120" width="180" height="22" rx="6" fill="#FFFFFF" stroke="#E8D5CC"/>
    <text x="542" y="136" text-anchor="middle" class="label">客服｜责任说明</text>
    <rect x="734" y="120" width="180" height="22" rx="6" fill="#FFFFFF" stroke="#E8D5CC"/>
    <text x="824" y="136" text-anchor="middle" class="label">管理者｜看板周报</text>
  </g>

  <g id="reasoning">
    <rect x="36" y="168" width="1006" height="92" rx="10" fill="#FFF7F2" stroke="#E4372E" stroke-width="1.5"/>
    <text x="539" y="196" text-anchor="middle" class="band-title" fill="#E4372E">房修小匠智能体｜领域回答链路</text>
    <rect x="128" y="218" width="154" height="26" rx="6" fill="#FFFFFF" stroke="#E4372E"/>
    <text x="205" y="236" text-anchor="middle" class="label">检索规范</text>
    <rect x="334" y="218" width="154" height="26" rx="6" fill="#FFFFFF" stroke="#E4372E"/>
    <text x="411" y="236" text-anchor="middle" class="label">匹配案例</text>
    <rect x="540" y="218" width="154" height="26" rx="6" fill="#FFFFFF" stroke="#E4372E"/>
    <text x="617" y="236" text-anchor="middle" class="label">划分保修责任</text>
    <rect x="746" y="218" width="200" height="26" rx="6" fill="#FFFFFF" stroke="#E4372E"/>
    <text x="846" y="236" text-anchor="middle" class="label">生成可执行维修方案</text>
    <line x1="282" y1="231" x2="324" y2="231" stroke="#E4372E" stroke-width="2" marker-end="url(#arrowRed)"/>
    <line x1="488" y1="231" x2="530" y2="231" stroke="#E4372E" stroke-width="2" marker-end="url(#arrowRed)"/>
    <line x1="694" y1="231" x2="736" y2="231" stroke="#E4372E" stroke-width="2" marker-end="url(#arrowRed)"/>
  </g>

  <g id="knowledge">
    <rect x="36" y="278" width="1006" height="92" rx="10" fill="#F9F5EF" stroke="#8C5A3C" stroke-width="1.5"/>
    <text x="539" y="306" text-anchor="middle" class="band-title" fill="#8C5A3C">知识资产层｜可持续更新</text>
    <rect x="140" y="328" width="176" height="25" rx="6" fill="#FFFFFF" stroke="#DCC9BD"/>
    <text x="228" y="345" text-anchor="middle" class="label">500+ 维修案例</text>
    <rect x="382" y="328" width="176" height="25" rx="6" fill="#FFFFFF" stroke="#DCC9BD"/>
    <text x="470" y="345" text-anchor="middle" class="label">103 条维修规范</text>
    <rect x="624" y="328" width="176" height="25" rx="6" fill="#FFFFFF" stroke="#DCC9BD"/>
    <text x="712" y="345" text-anchor="middle" class="label">企业文档持续上传</text>
    <rect x="866" y="328" width="120" height="25" rx="6" fill="#FFFFFF" stroke="#DCC9BD"/>
    <text x="926" y="345" text-anchor="middle" class="label">审核启用</text>
  </g>

  <g id="infrastructure">
    <rect x="36" y="388" width="1006" height="92" rx="10" fill="#F2F6F0" stroke="#394936" stroke-width="1.5"/>
    <text x="539" y="416" text-anchor="middle" class="band-title" fill="#394936">企业基础设施层｜把能力掌握在自己手里</text>
    <rect x="124" y="438" width="166" height="25" rx="6" fill="#FFFFFF" stroke="#B8C6B4"/>
    <text x="207" y="455" text-anchor="middle" class="label">Docker 私有化</text>
    <rect x="324" y="438" width="166" height="25" rx="6" fill="#FFFFFF" stroke="#B8C6B4"/>
    <text x="407" y="455" text-anchor="middle" class="label">本地向量模型 / 索引</text>
    <rect x="524" y="438" width="166" height="25" rx="6" fill="#FFFFFF" stroke="#B8C6B4"/>
    <text x="607" y="455" text-anchor="middle" class="label">语义缓存</text>
    <rect x="724" y="438" width="166" height="25" rx="6" fill="#FFFFFF" stroke="#B8C6B4"/>
    <text x="807" y="455" text-anchor="middle" class="label">8 路流式 + 排队</text>
  </g>

  <g id="outputs">
    <rect x="36" y="498" width="1006" height="92" rx="10" fill="#FFF8E8" stroke="#F2B24A" stroke-width="1.5"/>
    <text x="539" y="526" text-anchor="middle" class="band-title" fill="#8C5A3C">交付资产层｜从回答到企业运营</text>
    <rect x="130" y="548" width="176" height="25" rx="6" fill="#FFFFFF" stroke="#E8D29B"/>
    <text x="218" y="565" text-anchor="middle" class="label">HTML / PDF 方案</text>
    <rect x="350" y="548" width="176" height="25" rx="6" fill="#FFFFFF" stroke="#E8D29B"/>
    <text x="438" y="565" text-anchor="middle" class="label">编号存档 / 溯源</text>
    <rect x="570" y="548" width="176" height="25" rx="6" fill="#FFFFFF" stroke="#E8D29B"/>
    <text x="658" y="565" text-anchor="middle" class="label">管理看板</text>
    <rect x="790" y="548" width="176" height="25" rx="6" fill="#FFFFFF" stroke="#E8D29B"/>
    <text x="878" y="565" text-anchor="middle" class="label">运营周报</text>
  </g>

  <g id="governance-rail">
    <rect x="1065" y="84" width="179" height="506" rx="10" fill="#FFFFFF" stroke="#161616" stroke-width="1.5"/>
    <rect x="1065" y="84" width="179" height="58" rx="10" fill="#161616"/>
    <text x="1154" y="119" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="800" fill="#FAF9F5">治理与审计</text>
    <rect x="1087" y="170" width="135" height="52" rx="8" fill="#F7F4EC" stroke="#D8D0C5" stroke-dasharray="4,3"/>
    <text x="1154" y="201" text-anchor="middle" class="rail">三角色权限</text>
    <rect x="1087" y="242" width="135" height="52" rx="8" fill="#F7F4EC" stroke="#D8D0C5" stroke-dasharray="4,3"/>
    <text x="1154" y="273" text-anchor="middle" class="rail">操作审计</text>
    <rect x="1087" y="314" width="135" height="52" rx="8" fill="#F7F4EC" stroke="#D8D0C5" stroke-dasharray="4,3"/>
    <text x="1154" y="345" text-anchor="middle" class="rail">责任溯源</text>
    <rect x="1087" y="386" width="135" height="52" rx="8" fill="#F7F4EC" stroke="#D8D0C5" stroke-dasharray="4,3"/>
    <text x="1154" y="417" text-anchor="middle" class="rail">安全审计</text>
    <rect x="1087" y="458" width="135" height="52" rx="8" fill="#F7F4EC" stroke="#D8D0C5" stroke-dasharray="4,3"/>
    <text x="1154" y="489" text-anchor="middle" class="rail">数据不出机房</text>
  </g>

  <g id="footer">
    <rect x="36" y="620" width="1208" height="62" rx="10" fill="#161616"/>
    <text x="64" y="647" font-family="Microsoft YaHei" font-size="18" font-weight="800" fill="#F2B24A">核心变化</text>
    <text x="196" y="647" font-family="Microsoft YaHei" font-size="17" fill="#FAF9F5">不是做一个机器人，而是交付一个企业系统。</text>
    <text x="64" y="670" font-family="Microsoft YaHei" font-size="13" fill="#82D8C0">客户可拥有、可治理、可持续运营　｜　昭桥 · 企业 AI 系统交付案例</text>
  </g>
</svg>
