*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--lav)}

.hero{min-height:calc(100vh - 82px);display:flex;align-items:center}.hero-grid{display:grid;grid-template-columns:minmax(420px, .88fr) minmax(440px,1.12fr);align-items:center;min-height:calc(100vh - 82px);gap:50px}.copy{padding:48px 0 72px;max-width:535px}.eyebrow{display:flex;align-items:center;gap:10px;color:#79688f;font-size:11px;font-weight:800;letter-spacing:.18em}.eyebrow i{width:26px;height:2px;border-radius:2px;background:var(--coral)}h1{font-size:clamp(56px,6.6vw,92px);line-height:1.03;letter-spacing:-.085em;margin:24px 0 24px;font-weight:900;color:#2d2540}h1 span{display:inline-block;position:relative}h1 span:after{content:"";position:absolute;height:8px;left:4px;right:-10px;bottom:-6px;border-radius:8px;background:#ed9b8e;z-index:-1;opacity:.72}.lead{font-size:21px;line-height:1.5;font-weight:800;margin:0;color:#4c3d61}.desc{font-size:15px;line-height:1.9;color:var(--muted);max-width:430px;margin:13px 0 0}.actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:11px;border-radius:999px;padding:14px 20px;text-decoration:none;font-weight:800;font-size:12px}.btn.primary{background:#5d467b;color:#fff;box-shadow:0 13px 30px #6b4e9230}.btn.ghost{border:1px solid #987bb8;color:#634b80;background:#ffffff70}.proof{display:flex;gap:19px;flex-wrap:wrap;margin-top:33px;font-size:11px;color:#7b6d8f}.proof b{color:#8968c1;margin-right:6px;font-size:10px;letter-spacing:.1em}
.visual-note{align-self:end;padding:0 0 48px 10px;color:#7d708e;font-size:10px;letter-spacing:.16em}.visual-note strong{display:block;color:#4e3c67;font-size:17px;letter-spacing:-.03em;margin-top:8px}.visual-note span{display:block;margin-top:5px;color:#877993;letter-spacing:.05em}
.bottom{position:absolute;left:0;right:0;bottom:0;border-top:1px solid rgba(88,69,112,.12);background:#ffffff52;backdrop-filter:blur(12px)}.bottom-inner{height:56px;display:flex;align-items:center;justify-content:space-between;color:#776986;font-size:11px;letter-spacing:.06em}.signals{display:flex;align-items:center;gap:13px}.signals i{width:5px;height:5px;border-radius:50%;background:#9d83df}.signals span{color:#66577a}
@media(max-width:900px){.wrap{width:min(100% - 38px,700px)}.nav-links{display:none}.hero{min-height:calc(100vh - 70px)}.hero-grid{display:block;min-height:calc(100vh - 70px)}.copy{padding:60px 0 360px}.hero-image{object-position:62% center}.wash{background:linear-gradient(180deg,rgba(247,245,255,.96) 0%,rgba(247,245,255,.83) 35%,rgba(247,245,255,.18) 72%,rgba(247,245,255,.46) 100%)}.visual-note{display:none}.bottom-inner{height:auto;min-height:52px;gap:14px;padding:10px 0;align-items:flex-start;flex-direction:column}.signals{gap:8px;flex-wrap:wrap}}
@media(max-width:560px){.wrap{width:calc(100% - 28px)}.nav{height:68px}.brand img{width:32px;height:32px}.brand-cn{font-size:17px}h1{font-size:53px;margin-top:20px}.lead{font-size:18px}.desc{font-size:14px}.copy{padding-top:45px;padding-bottom:330px}.hero-image{object-position:65% center}.actions{margin-top:24px}.btn{width:100%;justify-content:center}.bottom-inner{font-size:10px}}
