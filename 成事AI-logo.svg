    <rect x="0" y="22" width="82" height="82" rx="17" transform="rotate(-45 41 63)" fill="#2855E8"/>
    <path d="M104 124 L232 0" stroke="#FF7A45" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M214 0 L262 0 L262 48" fill="none" stroke="#FF7A45" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="410" y="200" fill="#F8F6F0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="92" font-weight="700" letter-spacing="3">成事AI</text>
  <text x="416" y="270" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="26" letter-spacing="8">CHENGSHI AI</text>
